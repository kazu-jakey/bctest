/* ── バーコードと書誌 ───────────────── */
/*  検証で確定した構成：
      読み取り … 端末内蔵（Android等）→ zxing-wasm（iOS）
      枠の中だけを切り出し、EAN-13 に限定して解析する
      書誌 …… openBD の後継API（ブラウザから直接呼べる唯一の経路）
      整形 …… 図書館の典拠形式をそのまま出さない                     */
let scStream = null, scRunning = false, scDetector = null, scNative = false;

async function initDetector(){
  if (scDetector) return true;
  if ('BarcodeDetector' in window){
    try {
      const f = await BarcodeDetector.getSupportedFormats();
      if (f.includes('ean_13')){
        scDetector = new BarcodeDetector({ formats:['ean_13'] });
        scNative = true;
        return true;
      }
    } catch(e){}
  }
  for (const u of ['https://esm.sh/barcode-detector@2.3.1/pure',
                   'https://cdn.jsdelivr.net/npm/barcode-detector@2.3.1/dist/es/pure.js']){
    try {
      const mod = await import(u);
      const BD = mod.BarcodeDetector || mod.default;
      scDetector = new BD({ formats:['ean_13'] });
      scNative = false;
      return true;
    } catch(e){}
  }
  return false;
}

function validIsbn13(v){
  if (!/^\d{13}$/.test(v)) return false;
  if (!(v.startsWith('978') || v.startsWith('979'))) return false;
  let sum = 0;
  for (let i=0;i<12;i++) sum += (+v[i]) * (i % 2 ? 3 : 1);
  return (10 - (sum % 10)) % 10 === +v[12];
}

$('aScan').onclick = async () => {
  $('scMsg').textContent = '読み取りを用意しています…';
  $('scT').textContent = '';
  open('scScan');
  if (!await initDetector()){
    close('scScan');
    setScanMsg('この端末では読み取りを使えませんでした。書名を手で入れてください。', true);
    return;
  }
  try {
    scStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 } } });
  } catch(e){
    close('scScan');
    setScanMsg('カメラを使えませんでした（' + e.name + '）。書名を手で入れてください。', true);
    return;
  }
  const v = $('scVideo');
  v.srcObject = scStream; await v.play();
  scRunning = true;
  $('scMsg').textContent = '枠に入れてください';
  const t0 = performance.now();
  const iv = setInterval(() => { if (scRunning) $('scT').textContent = ((performance.now()-t0)/1000).toFixed(1) + 's'; }, 200);

  const loop = async () => {
    if (!scRunning){ clearInterval(iv); return; }
    const vd = $('scVideo');
    if (vd.videoWidth){
      try {
        const c = document.createElement('canvas');
        const sx = vd.videoWidth*0.06, sw = vd.videoWidth*0.88;
        const sy = vd.videoHeight*0.36, sh = vd.videoHeight*0.27;
        c.width = Math.min(1400, sw*1.4)|0;
        c.height = (c.width*sh/sw)|0;
        c.getContext('2d',{willReadFrequently:true}).drawImage(vd, sx, sy, sw, sh, 0, 0, c.width, c.height);
        for (const f of await scDetector.detect(c)){
          if (validIsbn13(f.rawValue)){
            stopScan();
            if (navigator.vibrate) navigator.vibrate(60);
            await lookupIsbn(f.rawValue);
            return;
          }
        }
      } catch(e){}
    }
    setTimeout(loop, scNative ? 200 : 150);
  };
  loop();
};

function stopScan(){
  scRunning = false;
  if (scStream){ scStream.getTracks().forEach(t => t.stop()); scStream = null; }
  close('scScan');
}
$('scScan').querySelector('[data-close]').addEventListener('click', stopScan);

function setScanMsg(m, ng){
  const el = $('aScanMsg');
  el.textContent = m;
  el.className = 'scanmsg' + (ng ? ' ng' : '');
}

/* 図書館の典拠形式をそのまま出さない（実データで検証済み） */
function cleanTitle(t){
  if (!t) return { main:'', sub:'' };
  const parts = t.split(' : ');
  return { main: parts[0].split(' = ')[0].trim(), sub: parts.slice(1).join(' : ').trim() };
}
function cleanAuthor(a){
  if (!a) return '';
  return a.split(/[\s\/／]+/).filter(Boolean).map(tok => {
    const ps = tok.split(',').map(x => x.trim()).filter(x => x && !/^\d{4}-?\d{0,4}$/.test(x));
    if (!ps.length) return '';
    if (!/^[A-Za-z]/.test(ps[0])) return ps.join('');
    return ps.slice().reverse().join(' ').replace(/([a-z])([A-Z])/g, '$1 $2');
  }).filter(Boolean).join('、');
}

async function lookupIsbn(isbn){
  setScanMsg('書誌を調べています… ' + isbn);
  try {
    const r = await fetch('https://api.openbd.jp/v1/get?isbn=' + isbn);
    const j = await r.json();
    const sm = j && j[0] && j[0].summary;
    if (!sm){
      setScanMsg(isbn + ' の書誌が見つかりませんでした。書名を手で入れてください。', true);
      $('aTitle').focus();
      return;
    }
    const t = cleanTitle(sm.title);
    $('aTitle').value  = t.main;
    $('aSub').value    = t.sub;
    $('aAuthor').value = cleanAuthor(sm.author);
    scanned = { isbn, publisher: sm.publisher || '', subtitle: t.sub, pubdate: sm.pubdate || '' };
    setScanMsg('読み取りました' + (sm.publisher ? '（' + sm.publisher + '）' : '') + (t.sub ? '／' + t.sub : ''));
  } catch(e){
    setScanMsg('書誌を取得できませんでした（' + e.message + '）。書名を手で入れてください。', true);
  }
}

<!-- 本の追加 -->
<div class="screen" id="scAdd">
  <div class="shead"><button class="icon" data-close>✕</button><h2>本を追加</h2></div>
  <div class="body">
    <button class="cta scan" id="aScan">バーコードで読む<small>本の裏の 978 で始まる段</small></button>
    <p class="scanmsg" id="aScanMsg"></p>
    <div class="field"><label>書名</label><input id="aTitle" placeholder="ストーリーとしての競争戦略"></div>
    <div class="field"><label>副題<span class="opt">任意</span></label><input id="aSub" placeholder="優れた戦略の条件"></div>

<div class="warn" id="warn"><span id="warnMsg"></span>
  <button id="warnSave">書き出す</button></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const GENRES = ['ビジネス','実用','小説','歴史','科学','その他'];
const PRESET_TAGS = {
  'ビジネス':['経営・戦略','マーケティング','組織・マネジメント','会計・ファイナンス','起業','キャリア','リーダーシップ','営業','交渉・伝え方','仕事術'],
  '実用':['お金・投資','健康','料理','暮らし・住まい','子育て','勉強法','語学','デザイン','IT・ツール','自己啓発'],
  '小説':['ミステリ・サスペンス','恋愛','SF','ファンタジー','時代小説','現代小説','ホラー'],
  '歴史':['日本史','世界史','戦史','人物・評伝','古代・考古'],
  '科学':['物理・数学','生物','脳・心理','医学','環境','テクノロジー','統計・データ'],
  'その他':['エッセイ・随筆','哲学・思想','宗教','芸術','旅行','スポーツ','漫画']
};
const PALETTE = ['#2E4A5C','#4B5D46','#6B3B44','#7A6A4F','#3C4A6B','#5A4E6B','#405B5E','#6E6152','#8A7A3F','#6B4A3C'];
const PLACES = ['電車','寝る前','自宅','喫茶店','職場'];

let db = { books:[], sessions:[], notes:[], places:[] };
let tab = 'finished', cur = null, timer = null;

/* ── 保存 ───────────────────────────── */
/*  保存先は環境で変わる。
      Claude の画面内 … window.storage
      GitHub Pages 等 … ブラウザの IndexedDB
    どちらも使えないときだけ警告を出す。                          */
const store = (() => {
  const KEY = 'tana-db';
  if (typeof window.storage !== 'undefined' && window.storage){
    return {
      name:'claude',
      get: async () => { const r = await window.storage.get(KEY); return r ? r.value : null; },
      set: async v => { await window.storage.set(KEY, v); }
    };
  }
  const open = () => new Promise((res, rej) => {
    const q = indexedDB.open('tana', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
  return {
    name:'indexeddb',
    get: async () => {
      const d = await open();
      return new Promise((res, rej) => {
        const r = d.transaction('kv','readonly').objectStore('kv').get(KEY);
        r.onsuccess = () => res(r.result ?? null);
        r.onerror = () => rej(r.error);
      });
    },
    set: async v => {
      const d = await open();
      return new Promise((res, rej) => {
        const tx = d.transaction('kv','readwrite');
        tx.objectStore('kv').put(v, KEY);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    }
  };
})();

let saveFail = 0;
async function save(){
  const payload = JSON.stringify(db);
  for (let i = 0; i < 3; i++){
    try {
      await store.set(payload);
      saveFail = 0;
      $('warn').classList.remove('on');
      return true;
    } catch(e){
      console.warn('保存に失敗（' + (i+1) + '回目）', e);
      await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
  }
  saveFail++;
  $('warn').classList.add('on');
  $('warnMsg').textContent = '保存できませんでした（' + saveFail + '回目）。書き出しておくと安全です。';
  return false;
}
async function load(){
  try {
    const v = await store.get();
    if (v) db = Object.assign({ books:[], sessions:[], notes:[], places:[] }, JSON.parse(v));
  } catch(e){ console.warn('読み込みに失敗', e); }
  render();
}

/* ── 小道具 ─────────────────────────── */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function hash(s){ let h=0; for (let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function colorOf(b){ return PALETTE[hash(b.title + (b.author||'')) % PALETTE.length]; }

/* 1日の切れ目は午前4時 */
function readingDate(d = new Date()){
  const t = new Date(d.getTime() - 4*3600*1000);
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
}
function fmtDate(s){ const [y,m,d] = s.split('-'); return `${y}.${m}.${d}`; }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 1900); }

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function coverHTML(b, opts = {}){
  const t = esc(b.title);
  const cls = t.length > 26 ? 'ttl sm' : 'ttl';
  const hasNote = db.notes.some(n => n.bookId === b.id && (n.purpose||n.answer||n.content||n.impression));
  const sub = (b.subtitle && !opts.small) ? `<span class="subbtm">${esc(b.subtitle)}</span>` : '';
  return `<span class="bk" style="background:${colorOf(b)}">
    <span class="pad"><span class="${cls}">${t.length > 42 ? t.slice(0,42)+'…' : t}</span>
    <span class="rule"></span>${sub}<span class="aut">${esc(b.author||'')}</span></span>
    ${b.status === 'reading' && !opts.noRibbon ? '<span class="ribbon"></span>' : ''}
    ${hasNote ? '<span class="dot"></span>' : ''}</span>`;
}
const bookOf = id => db.books.find(b => b.id === id);
const noteOf = id => db.notes.find(n => n.bookId === id);
const minutesOf = id => db.sessions.filter(s => s.bookId === id).reduce((a,s)=>a+s.minutes,0);

/* ── 棚 ─────────────────────────────── */
function render(){
  const c = { finished:0, reading:0, want:0 };
  db.books.forEach(b => c[b.status]++);
  $('nFin').textContent  = c.finished || '';
  $('nRead').textContent = c.reading  || '';
  $('nWant').textContent = c.want     || '';
  [...$('tabs').children].forEach(t => t.classList.toggle('on', t.dataset.s === tab));

  const list = db.books.filter(b => b.status === tab);
  if (!list.length){ $('main').innerHTML = blankFor(tab); return; }

  if (tab === 'finished')      $('main').innerHTML = renderShelf(list);
  else if (tab === 'reading')  $('main').innerHTML = renderReading(list);
  else                         $('main').innerHTML = renderStack(list);

  $('main').querySelectorAll('[data-book]').forEach(el =>
    el.onclick = () => openBook(el.dataset.book));
  const g = $('main').querySelector('#goRead');
  if (g) g.onclick = () => startTimer(g.dataset.book);
}

function blankFor(t){
  const msg = { finished:'読み終えた本から並べていきます。', reading:'いま読んでいる本は、ここに立てておきます。', want:'気になった本を、ここに積んでおけます。' }[t];
  return `<div class="blank"><p>${msg}</p><button class="cta ghost" onclick="document.getElementById('btnAdd').click()">本を追加する</button></div>`;
}

function renderShelf(list){
  const sorted = list.slice().sort((a,b) => (b.finishedOn||'').localeCompare(a.finishedOn||''));
  let html = '', row = [], lastKey = null;
  const flush = () => {
    while (row.length && row.length < 3) row.push('<span class="filler"></span>');
    if (row.length){ html += `<div class="shelfrow">${row.join('')}</div><div class="plank"></div>`; row = []; }
  };
  sorted.forEach(b => {
    const key = (b.finishedOn || '').slice(0,4) || 'ー';
    if (key !== lastKey){ flush(); html += `<div class="tagline"><span class="t">${key === 'ー' ? '日付なし' : key + '年'}</span></div>`; lastKey = key; }
    row.push(`<span data-book="${b.id}">${coverHTML(b)}</span>`);
    if (row.length === 3) flush();
  });
  flush();
  return html;
}

function renderReading(list){
  const [head, ...rest] = list;
  const last = db.sessions.filter(s => s.bookId === head.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const n = noteOf(head.id);
  return `<div class="now">
      <span class="bkw" data-book="${head.id}">${coverHTML(head)}</span>
      <div class="now-meta">
        <p class="now-kicker">${last ? fmtDate(last.date) + ' のつづき' : 'まだ記録がありません'}</p>
        <h3>${esc(head.title)}</h3>
        ${head.subtitle ? `<p class="now-by" style="margin-bottom:4px">${esc(head.subtitle)}</p>` : ''}
        <p class="now-by">${esc(head.author||'')}</p>
        <p class="now-pos">${last && last.page ? last.page + ' ページまで' : ''}${minutesOf(head.id) ? (last&&last.page?' ／ ':'') + '通算 ' + minutesOf(head.id) + '分' : ''}</p>
        ${n && n.purpose ? `<dl class="aim" style="margin-bottom:14px"><dt>読む目的</dt><dd>${esc(n.purpose)}</dd></dl>` : ''}
        <button class="cta" id="goRead" data-book="${head.id}">つづきを読む</button>
      </div>
    </div>` +
    rest.map(b => `<button class="mini" data-book="${b.id}">
      <span class="bkw">${coverHTML(b,{small:true})}</span>
      <span><h4>${esc(b.title)}</h4><p>通算 ${minutesOf(b.id)}分</p></span></button>`).join('');
}

function renderStack(list){
  return `<div class="stack">` + list.map(b =>
    `<button class="slab" data-book="${b.id}" style="background-color:${colorOf(b)}">${esc(b.title)}${b.subtitle ? `<span class="slabsub">${esc(b.subtitle)}</span>` : ''}</button>`
  ).join('') + `</div>
  <p class="hintline">積んである本は、まだ使っていない在庫です。</p>`;
}

/* ── 画面の開閉 ─────────────────────── */
function open(id){ $(id).classList.add('on'); document.body.style.overflow = 'hidden'; }
function close(id){ $(id).classList.remove('on'); document.body.style.overflow = ''; }
document.querySelectorAll('[data-close]').forEach(el =>
  el.onclick = () => { close(el.closest('.screen').id); if (timer) stopTimer(); });

/* ── 追加 ───────────────────────────── */
let addState = { genre:'ビジネス', tags:[], status:'finished' };
$('btnAdd').onclick = () => {
  addState = { genre:'ビジネス', tags:[], status:'finished' };
  ['aTitle','aSub','aAuthor','aReason'].forEach(i => $(i).value = '');
  scanned = null; setScanMsg('');
  drawAddChips();
  open('scAdd');
  setTimeout(() => $('aTitle').focus(), 250);
};
function drawAddChips(){
  $('aGenre').innerHTML = GENRES.map(g =>
    `<button class="chip ${g===addState.genre?'on':''}" data-g="${g}">${g}</button>`).join('');
  $('aGenre').querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    addState.genre = b.dataset.g; addState.tags = []; drawAddChips();
  });
  const preset = PRESET_TAGS[addState.genre] || [];
  const extra = [...new Set(db.books.flatMap(b => b.tags||[]))].filter(t => !preset.includes(t));
  $('aTags').innerHTML = [...preset, ...extra].map(t =>
    `<button class="chip ${addState.tags.includes(t)?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')
    + `<button class="chip add" data-new>＋ 追加</button>`;
  $('aTags').querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    addState.tags = addState.tags.includes(t) ? addState.tags.filter(x=>x!==t) : [...addState.tags, t];
    drawAddChips();
  });
  $('aTags').querySelector('[data-new]').onclick = () => {
    askText('小分類を追加', t => { addState.tags.push(t); drawAddChips(); });
  };
  const labels = { finished:'読んだ', reading:'読みかけ', want:'これから' };
  $('aStatus').innerHTML = Object.entries(labels).map(([k,v]) =>
    `<button class="chip ${k===addState.status?'on':''}" data-st="${k}">${v}</button>`).join('');
  $('aStatus').querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    addState.status = b.dataset.st; drawAddChips();
  });
  $('aReasonWrap').style.display = addState.status === 'want' ? '' : 'none';
}
$('aSave').onclick = async () => {
  const title = $('aTitle').value.trim();
  if (!title){ toast('書名を入れてください'); $('aTitle').focus(); return; }
  const b = {
    id: uid(), title, author: $('aAuthor').value.trim(),
    genre: addState.genre, tags: addState.tags.slice(),
    status: addState.status, reason: $('aReason').value.trim(),
    isbn: scanned ? scanned.isbn : null,
    publisher: scanned ? scanned.publisher : '',
    subtitle: $('aSub').value.trim(),
    addedAt: readingDate(),
    finishedOn: addState.status === 'finished' ? readingDate() : null
  };
  db.books.unshift(b);
  await save();
  close('scAdd');
  tab = b.status; render();
  toast('棚に入りました');
  if (b.status === 'finished') setTimeout(() => openNote(b.id), 420);
};


/* ── バーコードと書誌 ───────────────── */
/*  検証で確定した構成：
      読み取り … 端末内蔵（Android等）→ zxing-wasm（iOS）
      枠の中だけを切り出し、EAN-13 に限定して解析する
      書誌 …… openBD の後継API（ブラウザから直接呼べる唯一の経路）
      整形 …… 図書館の典拠形式をそのまま出さない                     */
let scStream = null, scRunning = false, scDetector = null, scNative = false;

async function initDetector(){
  if (scDetector) return true;
  if ('BarcodeDetector' in window){
    try {
      const f = await BarcodeDetector.getSupportedFormats();
      if (f.includes('ean_13')){
        scDetector = new BarcodeDetector({ formats:['ean_13'] });
        scNative = true;
        return true;
      }
    } catch(e){}
  }
  for (const u of ['https://esm.sh/barcode-detector@2.3.1/pure',
                   'https://cdn.jsdelivr.net/npm/barcode-detector@2.3.1/dist/es/pure.js']){
    try {
      const mod = await import(u);
      const BD = mod.BarcodeDetector || mod.default;
      scDetector = new BD({ formats:['ean_13'] });
      scNative = false;
      return true;
    } catch(e){}
  }
  return false;
}

function validIsbn13(v){
  if (!/^\d{13}$/.test(v)) return false;
  if (!(v.startsWith('978') || v.startsWith('979'))) return false;
  let sum = 0;
  for (let i=0;i<12;i++) sum += (+v[i]) * (i % 2 ? 3 : 1);
  return (10 - (sum % 10)) % 10 === +v[12];
}

$('aScan').onclick = async () => {
  $('scMsg').textContent = '読み取りを用意しています…';
  $('scT').textContent = '';
  open('scScan');
  if (!await initDetector()){
    close('scScan');
    setScanMsg('この端末では読み取りを使えませんでした。書名を手で入れてください。', true);
    return;
  }
  try {
    scStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 } } });
  } catch(e){
    close('scScan');
    setScanMsg('カメラを使えませんでした（' + e.name + '）。書名を手で入れてください。', true);
    return;
  }
  const v = $('scVideo');
  v.srcObject = scStream; await v.play();
  scRunning = true;
  $('scMsg').textContent = '枠に入れてください';
  const t0 = performance.now();
  const iv = setInterval(() => { if (scRunning) $('scT').textContent = ((performance.now()-t0)/1000).toFixed(1) + 's'; }, 200);

  const loop = async () => {
    if (!scRunning){ clearInterval(iv); return; }
    const vd = $('scVideo');
    if (vd.videoWidth){
      try {
        const c = document.createElement('canvas');
        const sx = vd.videoWidth*0.06, sw = vd.videoWidth*0.88;
        const sy = vd.videoHeight*0.36, sh = vd.videoHeight*0.27;
        c.width = Math.min(1400, sw*1.4)|0;
        c.height = (c.width*sh/sw)|0;
        c.getContext('2d',{willReadFrequently:true}).drawImage(vd, sx, sy, sw, sh, 0, 0, c.width, c.height);
        for (const f of await scDetector.detect(c)){
          if (validIsbn13(f.rawValue)){
            stopScan();
            if (navigator.vibrate) navigator.vibrate(60);
            await lookupIsbn(f.rawValue);
            return;
          }
        }
      } catch(e){}
    }
    setTimeout(loop, scNative ? 200 : 150);
  };
  loop();
};

function stopScan(){
  scRunning = false;
  if (scStream){ scStream.getTracks().forEach(t => t.stop()); scStream = null; }
  close('scScan');
}
$('scScan').querySelector('[data-close]').addEventListener('click', stopScan);

function setScanMsg(m, ng){
  const el = $('aScanMsg');
  el.textContent = m;
  el.className = 'scanmsg' + (ng ? ' ng' : '');
}

/* 図書館の典拠形式をそのまま出さない（実データで検証済み） */
function cleanTitle(t){
  if (!t) return { main:'', sub:'' };
  const parts = t.split(' : ');
  return { main: parts[0].split(' = ')[0].trim(), sub: parts.slice(1).join(' : ').trim() };
}
function cleanAuthor(a){
  if (!a) return '';
  return a.split(/[\s\/／]+/).filter(Boolean).map(tok => {
    const ps = tok.split(',').map(x => x.trim()).filter(x => x && !/^\d{4}-?\d{0,4}$/.test(x));
    if (!ps.length) return '';
    if (!/^[A-Za-z]/.test(ps[0])) return ps.join('');
    return ps.slice().reverse().join(' ').replace(/([a-z])([A-Z])/g, '$1 $2');
  }).filter(Boolean).join('、');
}

async function lookupIsbn(isbn){
  setScanMsg('書誌を調べています… ' + isbn);
  try {
    const r = await fetch('https://api.openbd.jp/v1/get?isbn=' + isbn);
    const j = await r.json();
    const sm = j && j[0] && j[0].summary;
    if (!sm){
      setScanMsg(isbn + ' の書誌が見つかりませんでした。書名を手で入れてください。', true);
      $('aTitle').focus();
      return;
    }
    const t = cleanTitle(sm.title);
    $('aTitle').value  = t.main;
    $('aSub').value    = t.sub;
    $('aAuthor').value = cleanAuthor(sm.author);
    scanned = { isbn, publisher: sm.publisher || '', subtitle: t.sub, pubdate: sm.pubdate || '' };
    setScanMsg('読み取りました' + (sm.publisher ? '（' + sm.publisher + '）' : '') + (t.sub ? '／' + t.sub : ''));
  } catch(e){
    setScanMsg('書誌を取得できませんでした（' + e.message + '）。書名を手で入れてください。', true);
  }
}
let scanned = null;

/* ── 本の詳細 ───────────────────────── */
function openBook(id){
  cur = id;
  const b = bookOf(id); if (!b) return;
  const n = noteOf(id) || {};
  const ss = db.sessions.filter(s => s.bookId === id).sort((a,b)=>b.date.localeCompare(a.date));
  const mins = minutesOf(id);
  const has = n.purpose || n.answer || n.content || n.impression;
  const labels = { finished:'読んだ', reading:'読みかけ', want:'これから' };

  $('bBody').innerHTML = `
    <div class="dhead">
      <span class="bkw">${coverHTML(b, {noRibbon:true})}</span>
      <div class="m">
        <h3>${esc(b.title)}</h3>
        ${b.subtitle ? `<p class="sub2">${esc(b.subtitle)}</p>` : ''}
        <p class="by">${esc(b.author||'著者不明')}</p>
        <p class="meta">${labels[b.status]}${b.finishedOn ? ' ／ ' + fmtDate(b.finishedOn) : ''}<br>
          ${b.publisher ? esc(b.publisher) + '<br>' : ''}${esc(b.genre)}${(b.tags||[]).length ? ' ／ ' + b.tags.map(esc).join('・') : ''}
          ${mins ? '<br>通算 ' + mins + '分' : ''}</p>
      </div>
    </div>
    ${b.reason ? `<div class="sect"><h4>買ったときのメモ</h4><dl class="qa imp"><dd>${esc(b.reason)}</dd></dl></div>` : ''}
    <div class="sect">
      <h4>記録</h4>
      ${has ? `
        ${n.purpose ? `<dl class="qa"><dt>読む目的</dt><dd>${esc(n.purpose)}</dd></dl>` : ''}
        ${n.answer ? `<dl class="qa"><dt>目的への答え</dt><dd>${esc(n.answer)}</dd></dl>` : ''}
        ${n.content ? `<dl class="qa"><dt>本の中身</dt><dd>${esc(n.content)}</dd></dl>` : ''}
        ${n.impression ? `<dl class="qa imp"><dt>感想</dt><dd>${esc(n.impression)}</dd></dl>` : ''}`
      : `<p class="empty">まだ書いていません。読み終えてからでも、途中でもかまいません。</p>`}
    </div>
    ${ss.length ? `<div class="sect"><h4>読んだ日</h4>${ss.map(s =>
      `<div class="sesrow"><span class="d">${fmtDate(s.date)}</span><span>${s.minutes}分</span>
       <span class="m">${s.page ? s.page + 'p' : ''}${s.place ? ' ／ ' + esc(s.place) : ''}</span></div>`).join('')}</div>` : ''}
    <div class="acts">
      ${b.status !== 'finished' ? `<button class="cta" id="bRead">読む</button>` : ''}
      ${b.status !== 'finished' ? `<button class="cta ghost" id="bFinish">読み終えた</button>` : `<button class="cta ghost" id="bBack">読みかけに戻す</button>`}
    </div>
    <div class="acts"><button class="cta ghost" id="bDel" style="color:var(--shu)">この本を削除</button></div>`;

  const r = $('bRead');   if (r) r.onclick = () => startTimer(id);
  const f = $('bFinish'); if (f) f.onclick = async () => {
    b.status = 'finished'; b.finishedOn = readingDate(); await save();
    close('scBook'); tab = 'finished'; render(); toast('棚に入りました');
    setTimeout(() => openNote(id), 420);
  };
  const bk = $('bBack'); if (bk) bk.onclick = async () => {
    b.status = 'reading'; b.finishedOn = null; await save(); openBook(id); render();
  };
  $('bDel').onclick = () => askDelete(id, b.title);
  open('scBook');
}
$('bEdit').onclick = () => openNote(cur);

/* ── 文字を1つ入れてもらう ──────────── */
function askText(label, cb){
  $('txLabel').textContent = label;
  $('txInput').value = '';
  open('scText');
  setTimeout(() => $('txInput').focus(), 250);
  $('txOk').onclick = () => {
    const v = $('txInput').value.trim();
    close('scText');
    if (v) cb(v);
  };
}

/* ── 削除の確認 ─────────────────────── */
function askDelete(id, title){
  $('cfText').textContent = '「' + title + '」と、その記録・読書時間をすべて削除します。';
  open('scConfirm');
  $('cfYes').onclick = async () => {
    db.books    = db.books.filter(x => x.id !== id);
    db.notes    = db.notes.filter(x => x.bookId !== id);
    db.sessions = db.sessions.filter(x => x.bookId !== id);
    await save();
    close('scConfirm'); close('scBook');
    render(); toast('削除しました');
  };
}

/* ── 記録を書く ─────────────────────── */
function openNote(id){
  cur = id;
  const b = bookOf(id), n = noteOf(id) || {};
  $('nFor').textContent = b.title + (b.author ? ' ／ ' + b.author : '');
  $('nPurpose').value = n.purpose || '';
  $('nAnswer').value  = n.answer || '';
  $('nContent').value = n.content || '';
  $('nImp').value     = n.impression || '';
  open('scNote');
}
async function saveNote(){
  let n = noteOf(cur);
  if (!n){ n = { id: uid(), bookId: cur, writtenOn: readingDate() }; db.notes.push(n); }
  n.purpose    = $('nPurpose').value.trim();
  n.answer     = $('nAnswer').value.trim();
  n.content    = $('nContent').value.trim();
  n.impression = $('nImp').value.trim();
  await save(); close('scNote');
  if ($('scBook').classList.contains('on')) openBook(cur); else render();
  toast('記録しました');
}
$('nSave').onclick  = saveNote;
$('nSave2').onclick = saveNote;

/* ── 読書セッション ─────────────────── */
function startTimer(id){
  cur = id;
  const b = bookOf(id), n = noteOf(id) || {};
  if (b.status === 'want'){ b.status = 'reading'; save(); }
  timer = { start: Date.now(), paused: 0, pausedAt: null };
  $('tBody').innerHTML = `
    <span class="bkw" style="display:block">${coverHTML(b,{noRibbon:true})}</span>
    <h3>${esc(b.title)}</h3><p class="by">${esc(b.author||'')}</p>
    <p class="clock" id="tClock">0<small>:</small>00</p>
    <p class="since">${new Date().getHours()}時${String(new Date().getMinutes()).padStart(2,'0')}分 から</p>
    ${n.purpose ? `<dl class="aim"><dt>読む目的</dt><dd>${esc(n.purpose)}</dd></dl>` : ''}
    <button class="cta" id="tEnd">読み終える</button>
    <button class="cta ghost" id="tPause" style="margin-top:9px">一時停止</button>
    <button class="textbtn" id="tManual">時間を手で入れる</button>`;
  open('scTimer');
  tick();
  timer.iv = setInterval(tick, 500);
  $('tEnd').onclick = () => endTimer();
  $('tPause').onclick = () => {
    if (timer.pausedAt){ timer.paused += Date.now() - timer.pausedAt; timer.pausedAt = null; $('tPause').textContent = '一時停止'; }
    else { timer.pausedAt = Date.now(); $('tPause').textContent = '再開する'; }
  };
  $('tManual').onclick = () => endTimer(true);
}
function elapsed(){
  if (!timer) return 0;
  const p = timer.paused + (timer.pausedAt ? Date.now() - timer.pausedAt : 0);
  return Math.max(0, Date.now() - timer.start - p);
}
function tick(){
  const s = Math.floor(elapsed()/1000);
  const el = $('tClock'); if (el) el.innerHTML = Math.floor(s/60) + '<small>:</small>' + String(s%60).padStart(2,'0');
}
function stopTimer(){ if (timer && timer.iv) clearInterval(timer.iv); timer = null; }

function endTimer(manual){
  const mins = manual ? 0 : Math.max(1, Math.round(elapsed()/60000));
  stopTimer(); close('scTimer');
  const b = bookOf(cur);
  const last = db.sessions.filter(s => s.bookId === cur).sort((a,b)=>b.date.localeCompare(a.date))[0];
  $('dMin').textContent = manual ? '記録する' : mins + '分';
  const total = db.sessions.reduce((a,s)=>a+s.minutes,0);
  $('dTotal').textContent = '通算 ' + Math.floor(total/60) + '時間' + (total%60) + '分';
  $('dMinutes').value = manual ? '' : mins;
  $('dPage').value = '';
  $('dPage').placeholder = last && last.page ? '前回 ' + last.page + 'ページ' : 'ページ';
  $('dMemo').value = '';
  drawPlaces(null);
  open('scDone');
  if (manual) setTimeout(() => $('dMinutes').focus(), 250);
}
let placePick = null;
function drawPlaces(sel){
  placePick = sel;
  const used = [...new Set(db.sessions.map(s => s.place).filter(Boolean))];
  const all = [...used, ...PLACES.filter(p => !used.includes(p))];
  $('dPlace').innerHTML = all.map(p =>
    `<button class="chip ${p===sel?'on':''}" data-p="${esc(p)}">${esc(p)}</button>`).join('')
    + `<button class="chip add" data-newp>＋</button>`;
  $('dPlace').querySelectorAll('[data-p]').forEach(b => b.onclick = () =>
    drawPlaces(b.dataset.p === placePick ? null : b.dataset.p));
  $('dPlace').querySelector('[data-newp]').onclick = () => {
    askText('場所を追加', p => drawPlaces(p));
  };
}
$('dSave').onclick = async () => {
  const m = parseInt($('dMinutes').value, 10);
  if (!m || m < 1){ toast('読んだ時間を入れてください'); $('dMinutes').focus(); return; }
  db.sessions.push({
    id: uid(), bookId: cur, date: readingDate(), minutes: m,
    page: parseInt($('dPage').value,10) || null,
    place: placePick, memo: $('dMemo').value.trim()
  });
  const b = bookOf(cur);
  if (b.status === 'want'){ b.status = 'reading'; }
  await save(); close('scDone');
  tab = 'reading'; render();
  toast('記録しました');
};

/* ── さがす ─────────────────────────── */
let sGenre = null;
$('btnSearch').onclick = () => { $('sQ').value=''; sGenre=null; drawSearch(); open('scSearch'); setTimeout(()=>$('sQ').focus(),250); };
$('sQ').oninput = drawSearch;
function drawSearch(){
  $('sGenre').innerHTML = GENRES.map(g =>
    `<button class="chip ${g===sGenre?'on':''}" data-g="${g}">${g}</button>`).join('');
  $('sGenre').querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    sGenre = sGenre === b.dataset.g ? null : b.dataset.g; drawSearch();
  });

  const q = $('sQ').value.trim().toLowerCase();
  let rows = [];
  db.books.forEach(b => {
    if (sGenre && b.genre !== sGenre) return;
    const n = noteOf(b.id) || {};
    const fields = [
      ['読む目的', n.purpose], ['目的への答え', n.answer],
      ['本の中身', n.content], ['感想', n.impression], ['買ったときのメモ', b.reason]
    ].filter(f => f[1]);
    const inMeta = !q || (b.title + ' ' + (b.subtitle||'') + ' ' + (b.author||'') + ' ' + (b.tags||[]).join(' ')).toLowerCase().includes(q);
    let hit = false;
    fields.forEach(([label, text]) => {
      if (q && text.toLowerCase().includes(q)){
        hit = true;
        const i = text.toLowerCase().indexOf(q);
        const s = Math.max(0, i-22);
        const frag = (s>0?'…':'') + text.slice(s, i+q.length+44) + (i+q.length+44 < text.length?'…':'');
        rows.push({ b, label, frag: esc(frag).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'), m => `<mark>${m}</mark>`) });
      }
    });
    if (!hit && inMeta) rows.push({ b, label:'書名・著者', frag: esc((n.answer || n.impression || n.purpose || '').slice(0,60)) });
  });
  $('sCount').textContent = q || sGenre ? `${rows.length}件` : '書名・著者・タグ・メモの中身から探します';
  $('sRes').innerHTML = rows.map(r => `
    <button class="hit" data-book="${r.b.id}">
      <span class="bkw">${coverHTML(r.b,{noRibbon:true,small:true})}</span>
      <span class="m"><p class="src">${esc(r.b.title)} ─ ${r.label}</p>
      <p class="frag">${r.frag || ''}</p></span></button>`).join('');
  $('sRes').querySelectorAll('[data-book]').forEach(el =>
    el.onclick = () => { close('scSearch'); openBook(el.dataset.book); });
}

/* ── その他 ─────────────────────────── */
$('btnMore').onclick = () => {
  const total = db.sessions.reduce((a,s)=>a+s.minutes,0);
  const days = new Set(db.sessions.map(s => s.date)).size;
  $('mStats').innerHTML =
    `読んだ時間 ${Math.floor(total/60)}時間${total%60}分<br>` +
    `読み終えた本 ${db.books.filter(b=>b.status==='finished').length}冊<br>` +
    `読んだ日 ${days}日<br>記録のある本 ${db.notes.filter(n=>n.purpose||n.answer||n.content||n.impression).length}冊` +
    `<br><span style="color:var(--faint)">保存先：${store.name === 'claude' ? 'Claude の画面内' : 'このブラウザ（IndexedDB）'}</span>`;
  open('scMore');
};
$('mExport').onclick = () => {
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tana-' + readingDate() + '.json';
  a.click();
  toast('書き出しました');
};
$('warnSave').onclick = () => $('mExport').click();
$('mImport').onclick = () => $('mFile').click();
$('mFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.books) throw new Error('形式が違います');
      if (!confirm('いまのデータを置き換えます。よろしいですか')) return;
      db = Object.assign({ books:[], sessions:[], notes:[], places:[] }, d);
      await save(); close('scMore'); render(); toast('読み込みました');
    } catch(err){ toast('読み込めませんでした'); }
  };
  r.readAsText(f);
  e.target.value = '';
};

$('tabs').onclick = e => {
  const b = e.target.closest('.tab'); if (!b) return;
  tab = b.dataset.s; render();
};

load();
</script>
